name: "CI: Rust format"

on:
  pull_request:
    paths:
      - "libs/cua-driver/rust/**"
      - ".github/workflows/ci-rust-format.yml"
  push:
    branches: [main]
    paths:
      - "libs/cua-driver/rust/**"
      - ".github/workflows/ci-rust-format.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-rust-format-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  format:
    name: Rustfmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with:
          components: rustfmt
      - name: Check Rust formatting
        working-directory: libs/cua-driver/rust
        run: cargo fmt --all -- --check
